[package]
name = "smile_up"
version = "0.1.0"
edition = "2021"
authors = ["Miguel"]
description = "High-energy build-up & tension multi-FX plugin (VST3 & CLAP)"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["assert_process_allocs", "vst3"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
